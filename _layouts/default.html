<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | Tikeshwar Singh</title>

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <header class="site-header">

    <div class="site-name">
      <a href="{{ '/' | relative_url }}">Tikeshwar Singh</a>
    </div>

    <nav class="navigation">
      <a href="{{ '/' | relative_url }}">home</a>
      <a href="{{ '/research/' | relative_url }}">research</a>
      <a href="{{ '/resources/' | relative_url }}">resources</a>
      <a href="{{ '/blog/' | relative_url }}">blog</a>
      <a href="{{ '/nature/' | relative_url }}">nature</a>
      <a href="{{ '/ra/' | relative_url }}">RA</a>
      <a href="{{ '/cv/Singh_CV.pdf' | relative_url }}">cv</a>

      <button id="site-search-toggle" type="button"
              aria-label="Search website" title="Search website">
        <svg width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="m16 16 4.5 4.5"></path>
        </svg>
      </button>
      <button id="theme-toggle" type="button"
              aria-label="Switch to dark theme"
              title="Switch theme">☾</button>
    </nav>

  
    <section id="site-search-panel" aria-label="Website search" hidden>
      <label for="site-search-input">Search this website</label>
      <input id="site-search-input" type="search"
             placeholder="Search research, blog, resources..."
             autocomplete="off">
      <p id="site-search-status" aria-live="polite">
        Type to search all website pages.
      </p>
      <ul id="site-search-results"></ul>
    </section>
  </header>

<!-- Live India time and Manali weather -->
<section id="manali-live-widget" aria-label="India time and Manali weather">
  <div class="live-clock-block">
    <span class="live-widget-label">INDIA · LOCAL TIME</span>
    <time id="manali-clock">--:--:--</time>
    <span id="manali-date"></span>
  </div>
  <div class="live-weather-block">
    <span class="live-widget-label">MANALI, HIMACHAL PRADESH</span>
    <div class="live-weather-main">
      <span id="manali-temperature">--°C</span>
      <span id="manali-weather-description">Loading weather…</span>
    </div>
    <span id="manali-weather-details">Fetching latest conditions</span>
  </div>
</section>

<script>
(() => {
  const clock = document.getElementById("manali-clock");
  const date = document.getElementById("manali-date");
  const temperature = document.getElementById("manali-temperature");
  const description = document.getElementById("manali-weather-description");
  const details = document.getElementById("manali-weather-details");

  function updateClock() {
    const now = new Date();
    clock.textContent = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Kolkata",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
      hourCycle: "h23"
    }).format(now);
    date.textContent = new Intl.DateTimeFormat("en-IN", {
      timeZone: "Asia/Kolkata",
      weekday: "short", day: "numeric", month: "short", year: "numeric"
    }).format(now);
  }

  const weatherCodes = {
    0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy",
    3: "Overcast", 45: "Fog", 48: "Depositing rime fog",
    51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
    61: "Light rain", 63: "Rain", 65: "Heavy rain",
    71: "Light snow", 73: "Snow", 75: "Heavy snow",
    80: "Rain showers", 81: "Rain showers", 82: "Heavy showers",
    85: "Snow showers", 86: "Heavy snow showers",
    95: "Thunderstorm", 96: "Thunderstorm with hail",
    99: "Thunderstorm with hail"
  };

  async function updateWeather() {
    try {
      const url = "https://api.open-meteo.com/v1/forecast?latitude=32.2396&longitude=77.1887&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Asia%2FKolkata";
      const response = await fetch(url);
      if (!response.ok) throw new Error("Weather service unavailable");
      const data = await response.json();
      const current = data.current;

      temperature.textContent = Math.round(current.temperature_2m) + "°C";
      description.textContent = weatherCodes[current.weather_code] || "Current conditions";
      details.textContent =
        "Feels like " + Math.round(current.apparent_temperature) + "°C" +
        " · Humidity " + current.relative_humidity_2m + "%" +
        " · Wind " + Math.round(current.wind_speed_10m) + " km/h" +
        " · Updated " + new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit",
          hourCycle: "h23"
        }).format(new Date());
    } catch (error) {
      description.textContent = "Weather temporarily unavailable";
      details.textContent = "Please try again shortly.";
    }
  }

  updateClock();
  setInterval(updateClock, 1000);
  updateWeather();
  setInterval(updateWeather, 10 * 60 * 1000);
})();
</script>


  <main class="main-content{% if page.path contains 'blog/' %} blog-page{% endif %}{% if page.path contains 'ra/' %} ra-page{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© {{ 'now' | date: "%Y" }} Tikeshwar Singh</p>
  </footer>

  <script id="theme-toggle-script">
    (function () {
      const button = document.getElementById("theme-toggle");
      const saved = localStorage.getItem("site-theme");

      if (saved === "dark") document.body.classList.add("dark-mode");

      function updateButton() {
        const dark = document.body.classList.contains("dark-mode");
        button.textContent = dark ? "☀" : "☾";
        button.setAttribute(
          "aria-label",
          dark ? "Switch to light theme" : "Switch to dark theme"
        );
        button.title = dark ? "Switch to light theme" : "Switch to dark theme";
      }

      updateButton();

      button.addEventListener("click", function () {
        const dark = document.body.classList.toggle("dark-mode");
        localStorage.setItem("site-theme", dark ? "dark" : "light");
        updateButton();
      });
    })();
  </script>

  <script id="site-search-script">
    (function () {
      const button = document.getElementById("site-search-toggle");
      const panel = document.getElementById("site-search-panel");
      const input = document.getElementById("site-search-input");
      const results = document.getElementById("site-search-results");
      const status = document.getElementById("site-search-status");
      if (!button || !panel || !input || !results || !status) return;

      let indexPromise;

      function loadIndex() {
        if (!indexPromise) {
          indexPromise = fetch(
            "{{ '/search-index.json' | relative_url }}"
          ).then(function (response) {
            if (!response.ok) throw new Error("Search index unavailable");
            return response.json();
          });
        }
        return indexPromise;
      }

      function openSearch() {
        panel.hidden = false;
        input.focus();
      }

      function closeSearch() {
        panel.hidden = true;
        button.focus();
      }

      button.addEventListener("click", function () {
        if (panel.hidden) openSearch();
        else closeSearch();
      });

      document.addEventListener("keydown", function (event) {
        if ((event.key === "/" && !event.metaKey &&
             !event.ctrlKey && !event.altKey &&
             !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) ||
            ((event.metaKey || event.ctrlKey) &&
             event.key.toLowerCase() === "k")) {
          event.preventDefault();
          openSearch();
        }
        if (event.key === "Escape" && !panel.hidden) closeSearch();
      });

      input.addEventListener("input", async function () {
        const query = input.value.trim().toLowerCase();
        results.replaceChildren();

        if (query.length < 2) {
          status.textContent = "Type at least 2 characters to search.";
          return;
        }

        status.textContent = "Searching...";

        try {
          const pages = await loadIndex();
          const terms = query.split(/\s+/);

          const matches = pages.map(function (page) {
            const title = page.title || "Untitled page";
            const content = (page.content || "").toLowerCase();
            const searchable = (title + " " + content).toLowerCase();
            const score = terms.reduce(function (total, term) {
              if (!searchable.includes(term)) return -10000;
              return total +
                (title.toLowerCase().includes(term) ? 5 : 0) +
                (content.split(term).length - 1);
            }, 0);
            return { page: page, score: score };
          }).filter(function (item) {
            return item.score >= 0;
          }).sort(function (a, b) {
            return b.score - a.score;
          }).slice(0, 12);

          if (!matches.length) {
            status.textContent = "No results found. Try different keywords.";
            return;
          }

          status.textContent = matches.length +
            (matches.length === 12 ? " or more results" : " results found");

          matches.forEach(function (item) {
            const li = document.createElement("li");
            const link = document.createElement("a");
            link.href = item.page.url;
            link.textContent = item.page.title || item.page.url;
            li.appendChild(link);

            const excerpt = document.createElement("p");
            const text = (item.page.content || "")
              .replace(/\s+/g, " ").trim();
            excerpt.textContent = text.length > 170
              ? text.slice(0, 170) + "..."
              : text;
            li.appendChild(excerpt);
            results.appendChild(li);
          });
        } catch (error) {
          status.textContent =
            "Search could not load. Please refresh and try again.";
        }
      });
    })();
  </script>

</body>

</html>
