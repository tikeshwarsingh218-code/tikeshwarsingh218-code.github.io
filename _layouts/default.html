<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | Tikeshwar Singh</title>

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <header class="site-header">

    <div class="site-name">
      <a href="{{ '/' | relative_url }}">Tikeshwar Singh</a>
    </div>

    <nav class="navigation">
      <a href="{{ '/' | relative_url }}">home</a>
      <a href="{{ '/research/' | relative_url }}">research</a>
      <a href="{{ '/resources/' | relative_url }}">resources</a>
      <a href="{{ '/blog/' | relative_url }}">blog</a>
      <a href="{{ '/nature/' | relative_url }}">nature</a>
      <a href="{{ '/ra/' | relative_url }}">RA</a>
      <a href="{{ '/cv/Singh_CV.pdf' | relative_url }}">cv</a>

      <button id="site-search-toggle" type="button"
              aria-label="Search website" title="Search website">
        <svg width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="m16 16 4.5 4.5"></path>
        </svg>
      </button>
      <button id="theme-toggle" type="button"
              aria-label="Switch to dark theme"
              title="Switch theme">☾</button>
    </nav>

  
    <section id="site-search-panel" aria-label="Website search" hidden>
      <label for="site-search-input">Search this website</label>
      <input id="site-search-input" type="search"
             placeholder="Search research, blog, resources..."
             autocomplete="off">
      <p id="site-search-status" aria-live="polite">
        Type to search all website pages.
      </p>
      <ul id="site-search-results"></ul>
    </section>
  </header>




  <main class="main-content{% if page.path contains 'blog/' %} blog-page{% endif %}{% if page.path contains 'ra/' %} ra-page{% endif %}">
    {{ content }}
  </main>

  
<!-- Single visitor-local time and weather widget -->


<footer class="site-footer">
    <p>© {{ 'now' | date: "%Y" }} Tikeshwar Singh</p>
  
<!-- Footer time and local weather -->
<div id="manali-live-widget" aria-label="Local time and weather">
  <div class="footer-clock">
    <div class="footer-clock-time">
      <span aria-hidden="true">◷</span>
      <time id="manali-clock">Loading time…</time>
    </div>
    <span id="manali-date"></span>
  </div>
  <div class="footer-weather">
    <span id="manali-location-label">Finding your location…</span>
    <div class="footer-weather-line">
      <span id="manali-weather-icon" aria-hidden="true">☁</span>
      <strong id="manali-temperature">--°C</strong>
    </div>
    <span id="manali-weather-details">Loading local weather…</span>
    <span id="manali-coordinates"></span>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const clock = $("manali-clock");
  const date = $("manali-date");
  const place = $("manali-location-label");
  const temp = $("manali-temperature");
  const icon = $("manali-weather-icon");
  const details = $("manali-weather-details");
  const coordsText = $("manali-coordinates");

  if (!clock || !date || !place || !temp || !icon || !details || !coordsText) return;

  let timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
  let coords = null;

  function updateClock() {
    const now = new Date();
    clock.textContent = new Intl.DateTimeFormat(undefined, {
      timeZone, hour: "2-digit", minute: "2-digit",
      second: "2-digit", hour12: true
    }).format(now);
    date.textContent = new Intl.DateTimeFormat(undefined, {
      timeZone, weekday: "short", day: "numeric",
      month: "short", year: "numeric"
    }).format(now);
  }

  function weatherIcon(code) {
    if (code === 0) return "☀";
    if (code === 1) return "🌤";
    if (code === 2 || code === 3) return "☁";
    if (code === 45 || code === 48) return "🌫";
    if (code >= 51 && code <= 67) return "🌧";
    if (code >= 71 && code <= 77) return "❄";
    if (code >= 80 && code <= 82) return "🌦";
    if (code >= 85 && code <= 86) return "🌨";
    if (code >= 95) return "⛈";
    return "☁";
  }

  async function requestJSON(url) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 9000);
    try {
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) throw new Error("Request failed");
      return await response.json();
    } finally {
      clearTimeout(timeout);
    }
  }

  async function loadAt(lat, lon, fallbackName, fallbackZone) {
    coords = { lat, lon };
    coordsText.textContent = "Coordinates: " + lat.toFixed(4) + ", " + lon.toFixed(4);
    place.textContent = fallbackName || "Your location";

    try {
      const geo = await requestJSON(
        "https://api.bigdatacloud.net/data/reverse-geocode-client" +
        "?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=en"
      );
      const locality = geo.locality || geo.city || geo.principalSubdivision;
      place.textContent = [
        locality, geo.principalSubdivision, geo.countryName
      ].filter((v, i, a) => v && a.indexOf(v) === i).join(", ") || fallbackName || "Your location";
      timeZone = geo.timezone?.name || fallbackZone || timeZone;
    } catch {
      timeZone = fallbackZone || timeZone;
    }

    updateClock();
    await refreshWeather();
  }

  async function refreshWeather() {
    if (!coords) return;
    try {
      const data = await requestJSON(
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + coords.lat + "&longitude=" + coords.lon +
        "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto"
      );
      const c = data.current;
      if (!c) throw new Error("No current weather");
      temp.textContent = Math.round(c.temperature_2m) + "°C";
      icon.textContent = weatherIcon(c.weather_code);
      details.textContent =
        "Feels like " + Math.round(c.apparent_temperature) + "°C" +
        " · Humidity " + c.relative_humidity_2m + "%" +
        " · Wind " + Math.round(c.wind_speed_10m) + " km/h";
      timeZone = data.timezone || timeZone;
      updateClock();
    } catch {
      details.textContent = "Weather temporarily unavailable";
    }
  }

  function useNetworkFallback() {
    requestJSON("https://ipapi.co/json/")
      .then(data => {
        if (typeof data.latitude !== "number" || typeof data.longitude !== "number") {
          throw new Error("Network location unavailable");
        }
        loadAt(
          data.latitude, data.longitude,
          [data.city, data.region, data.country_name].filter(Boolean).join(", "),
          data.timezone
        );
      })
      .catch(() => {
        place.textContent = "Location unavailable";
        details.textContent = "Allow browser location access to show local weather.";
        coordsText.textContent = "";
      });
  }

  updateClock();
  setInterval(updateClock, 1000);
  setInterval(refreshWeather, 10 * 60 * 1000);

  if (navigator.geolocation && window.isSecureContext) {
    navigator.geolocation.getCurrentPosition(
      p => loadAt(p.coords.latitude, p.coords.longitude, "", ""),
      useNetworkFallback,
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  } else {
    useNetworkFallback();
  }
})();
</script>

</footer>

  <script id="theme-toggle-script">
    (function () {
      const button = document.getElementById("theme-toggle");
      const saved = localStorage.getItem("site-theme");

      if (saved === "dark") document.body.classList.add("dark-mode");

      function updateButton() {
        const dark = document.body.classList.contains("dark-mode");
        button.textContent = dark ? "☀" : "☾";
        button.setAttribute(
          "aria-label",
          dark ? "Switch to light theme" : "Switch to dark theme"
        );
        button.title = dark ? "Switch to light theme" : "Switch to dark theme";
      }

      updateButton();

      button.addEventListener("click", function () {
        const dark = document.body.classList.toggle("dark-mode");
        localStorage.setItem("site-theme", dark ? "dark" : "light");
        updateButton();
      });
    })();
  </script>

  <script id="site-search-script">
    (function () {
      const button = document.getElementById("site-search-toggle");
      const panel = document.getElementById("site-search-panel");
      const input = document.getElementById("site-search-input");
      const results = document.getElementById("site-search-results");
      const status = document.getElementById("site-search-status");
      if (!button || !panel || !input || !results || !status) return;

      let indexPromise;

      function loadIndex() {
        if (!indexPromise) {
          indexPromise = fetch(
            "{{ '/search-index.json' | relative_url }}"
          ).then(function (response) {
            if (!response.ok) throw new Error("Search index unavailable");
            return response.json();
          });
        }
        return indexPromise;
      }

      function openSearch() {
        panel.hidden = false;
        input.focus();
      }

      function closeSearch() {
        panel.hidden = true;
        button.focus();
      }

      button.addEventListener("click", function () {
        if (panel.hidden) openSearch();
        else closeSearch();
      });

      document.addEventListener("keydown", function (event) {
        if ((event.key === "/" && !event.metaKey &&
             !event.ctrlKey && !event.altKey &&
             !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) ||
            ((event.metaKey || event.ctrlKey) &&
             event.key.toLowerCase() === "k")) {
          event.preventDefault();
          openSearch();
        }
        if (event.key === "Escape" && !panel.hidden) closeSearch();
      });

      input.addEventListener("input", async function () {
        const query = input.value.trim().toLowerCase();
        results.replaceChildren();

        if (query.length < 2) {
          status.textContent = "Type at least 2 characters to search.";
          return;
        }

        status.textContent = "Searching...";

        try {
          const pages = await loadIndex();
          const terms = query.split(/\s+/);

          const matches = pages.map(function (page) {
            const title = page.title || "Untitled page";
            const content = (page.content || "").toLowerCase();
            const searchable = (title + " " + content).toLowerCase();
            const score = terms.reduce(function (total, term) {
              if (!searchable.includes(term)) return -10000;
              return total +
                (title.toLowerCase().includes(term) ? 5 : 0) +
                (content.split(term).length - 1);
            }, 0);
            return { page: page, score: score };
          }).filter(function (item) {
            return item.score >= 0;
          }).sort(function (a, b) {
            return b.score - a.score;
          }).slice(0, 12);

          if (!matches.length) {
            status.textContent = "No results found. Try different keywords.";
            return;
          }

          status.textContent = matches.length +
            (matches.length === 12 ? " or more results" : " results found");

          matches.forEach(function (item) {
            const li = document.createElement("li");
            const link = document.createElement("a");
            link.href = item.page.url;
            link.textContent = item.page.title || item.page.url;
            li.appendChild(link);

            const excerpt = document.createElement("p");
            const text = (item.page.content || "")
              .replace(/\s+/g, " ").trim();
            excerpt.textContent = text.length > 170
              ? text.slice(0, 170) + "..."
              : text;
            li.appendChild(excerpt);
            results.appendChild(li);
          });
        } catch (error) {
          status.textContent =
            "Search could not load. Please refresh and try again.";
        }
      });
    })();
  </script>

</body>

</html>
